name: CI

on:
  pull_request:
  push:
    branches: [main]

# Minimum-required GITHUB_TOKEN scopes. Limits blast radius if any third-party
# action in this workflow is ever compromised. Dependabot/Renovate PRs and
# normal PR builds only need to read the repo.
permissions:
  contents: read

jobs:
  analyze-test-format:
    runs-on: ubuntu-latest

    steps:
      # Third-party actions are pinned to full commit SHAs (not floating tags)
      # so a compromised tag move at the source can't ship malicious code into
      # our CI. Dependabot's `github-actions` ecosystem keeps these current.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # No step in this job pushes — don't leave GITHUB_TOKEN in the
          # runner's git credentials store where a later compromised step
          # could exfiltrate it.
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  dependency-build-bump:
    # Enforces DESIGN §13.4: any change to the resolved dependency set
    # (pubspec.lock) must come with an incremented build number (+N).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require build-number bump when dependencies change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # pubspec.lock is the exact record of compiled-in libraries; if it
          # is unchanged, no dependency changed and no bump is required.
          if git diff --quiet "$BASE_SHA" HEAD -- pubspec.lock; then
            echo "pubspec.lock unchanged; build-number bump not required."
            exit 0
          fi

          # Extract the integer after '+' from the `version:` line.
          extract_build() { awk '/^version:/ {print $2; exit}' | awk -F'+' '{print $2}'; }

          BASE_BUILD=$(git show "$BASE_SHA:pubspec.yaml" 2>/dev/null | extract_build)
          HEAD_BUILD=$(extract_build < pubspec.yaml)

          echo "pubspec.lock changed in this PR."
          echo "base build number: ${BASE_BUILD:-<none>}"
          echo "head build number: ${HEAD_BUILD:-<none>}"

          if ! [[ "$HEAD_BUILD" =~ ^[0-9]+$ ]]; then
            echo "::error file=pubspec.yaml::version must be of the form <semver>+<build> with an integer build number (see DESIGN §13.4)."
            exit 1
          fi
          if ! [[ "$BASE_BUILD" =~ ^[0-9]+$ ]]; then
            echo "::error::could not read a numeric build number from the base revision's pubspec.yaml."
            exit 1
          fi

          if [ "$HEAD_BUILD" -le "$BASE_BUILD" ]; then
            echo "::error file=pubspec.yaml::Dependencies changed (pubspec.lock) but the build number was not incremented. Set version to <semver>+$((BASE_BUILD + 1)) or higher (see DESIGN §13.4)."
            exit 1
          fi

          echo "Build number bumped $BASE_BUILD -> $HEAD_BUILD. OK."
