name: CI

on:
  pull_request:
  push:
    branches: [main]

# Minimum-required GITHUB_TOKEN scopes. Limits blast radius if any third-party
# action in this workflow is ever compromised. Dependabot/Renovate PRs and
# normal PR builds only need to read the repo.
permissions:
  contents: read

jobs:
  analyze-test-format:
    runs-on: ubuntu-latest

    steps:
      # Third-party actions are pinned to full commit SHAs (not floating tags)
      # so a compromised tag move at the source can't ship malicious code into
      # our CI. Dependabot's `github-actions` ecosystem keeps these current.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # No step in this job pushes — don't leave GITHUB_TOKEN in the
          # runner's git credentials store where a later compromised step
          # could exfiltrate it.
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
