name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create GitHub Release + upload APK asset
      id-token: write       # sign the build provenance attestation (Sigstore OIDC)
      attestations: write   # write the attestation back to the repo

    steps:
      # Third-party actions are pinned to full commit SHAs (not floating tags)
      # so a compromised tag move at the source can't ship malicious code into
      # the release build. Dependabot's `github-actions` ecosystem keeps these
      # current.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release job uses GITHUB_TOKEN via softprops/action-gh-release's
          # own input and OIDC for the provenance attestation — nothing here
          # needs the token persisted in git config.
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify tag matches pubspec version
        run: |
          PUBSPEC_VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $TAG_VERSION does not match pubspec.yaml version $PUBSPEC_VERSION"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/keystore.jks

      # NOTE on quoting: passing secrets through `env:` + `printf '%s\n'` is
      # the only safe way to get them into `key.properties` byte-for-byte.
      # The earlier `<<EOF` heredoc form did GitHub-side `${{ }}` text
      # substitution BEFORE bash ran, then bash performed parameter expansion
      # inside the unquoted heredoc — so any password containing `$`,
      # backtick, or `\` got mangled before reaching Gradle.
      - name: Write key.properties
        env:
          STORE_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          {
            printf 'storePassword=%s\n' "$STORE_PW"
            printf 'keyPassword=%s\n' "$KEY_PW"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=keystore.jks\n'
          } > android/key.properties

      - name: Build signed APK
        run: flutter build apk --release

      # Gradle produces `app-release.apk` (the gradle module is `app`,
      # release variant). Rename for the release asset so users see the
      # product name, not the build variant. The version is captured by the
      # release tag itself, so we don't need to include it in the filename.
      - name: Rename APK for release
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/rest-thermostat.apk

      - name: Extract changelog excerpt
        run: |
          if [ -f CHANGELOG.md ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            awk -v v="$VERSION" '
              /^## \[/ { p = ($0 ~ "\\["v"\\]"); next }
              p { print }
            ' CHANGELOG.md > release-body.md
            if [ ! -s release-body.md ]; then
              echo "Release ${GITHUB_REF_NAME}" > release-body.md
            fi
          else
            echo "Release ${GITHUB_REF_NAME}" > release-body.md
          fi

      # Attest that this APK was built from this exact commit in this exact
      # workflow run. Anyone with the released APK can verify provenance via
      # `gh attestation verify rest-thermostat.apk --owner MikeSiekkinen`,
      # which defends against backdoored APKs being uploaded to Releases out
      # of band.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: build/app/outputs/flutter-apk/rest-thermostat.apk

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: build/app/outputs/flutter-apk/rest-thermostat.apk
          body_path: release-body.md

      - name: Wipe key material
        if: always()
        run: |
          rm -f android/app/keystore.jks android/key.properties
