name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the GitHub Release + upload assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify tag matches pubspec version
        run: |
          PUBSPEC_VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $TAG_VERSION does not match pubspec.yaml version $PUBSPEC_VERSION"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/keystore.jks

      # NOTE on quoting: passing secrets through `env:` + `printf '%s\n'` is
      # the only safe way to get them into `key.properties` byte-for-byte.
      # The earlier `<<EOF` heredoc form did GitHub-side `${{ }}` text
      # substitution BEFORE bash ran, then bash performed parameter expansion
      # inside the unquoted heredoc — so any password containing `$`,
      # backtick, or `\` got mangled before reaching Gradle.
      - name: Write key.properties
        env:
          STORE_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          {
            printf 'storePassword=%s\n' "$STORE_PW"
            printf 'keyPassword=%s\n' "$KEY_PW"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=keystore.jks\n'
          } > android/key.properties

      - name: Build signed APK
        run: flutter build apk --release

      - name: Extract changelog excerpt
        run: |
          if [ -f CHANGELOG.md ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            awk -v v="$VERSION" '
              /^## \[/ { p = ($0 ~ "\\["v"\\]"); next }
              p { print }
            ' CHANGELOG.md > release-body.md
            if [ ! -s release-body.md ]; then
              echo "Release ${GITHUB_REF_NAME}" > release-body.md
            fi
          else
            echo "Release ${GITHUB_REF_NAME}" > release-body.md
          fi

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          body_path: release-body.md

      - name: Wipe key material
        if: always()
        run: |
          rm -f android/app/keystore.jks android/key.properties
