version: 2
updates:
  # Dart/Flutter dependencies (pubspec.yaml + pubspec.lock at repo root).
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions used by workflows under .github/workflows/.
  # With actions pinned to commit SHAs, Dependabot is what keeps them current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Android Gradle dependencies (Flutter's android shell).
  - package-ecosystem: "gradle"
    directory: "/android/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
