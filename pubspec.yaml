name: rest_thermostat
description: Community Flutter app for NoLongerEvil firmware on Nest Gen 1/2 thermostats.
publish_to: 'none'

version: 1.1.0+16

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # Floor 5.10.0: DioExceptionType.transformTimeout (handled in the error
  # classifier, retry logic, and logging interceptor) was added in 5.10.
  dio: ^5.10.0
  flutter_riverpod: ^3.3.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  google_fonts: ^8.1.0
  package_info_plus: ^10.1.0
  intl: ^0.20.2
  share_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  http_mock_adapter: ^0.6.1
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  image: ^4.8.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Enables `flutter gen-l10n` (run automatically by `flutter pub get`) for the
  # ARB → AppLocalizations codegen. Config lives in `l10n.yaml` at the repo
  # root; English template is `lib/l10n/app_en.arb`. DESIGN §15.4.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Ember theme bundled fonts. The google_fonts package resolves these at
  # runtime by scanning the asset bundle for files whose basename matches the
  # Google Fonts API naming convention (e.g. `Fraunces-Light.ttf`). Listing
  # the directory under `assets:` is sufficient — no explicit `fonts:` block
  # is required, and the README explicitly notes the files must NOT be
  # renamed.
  #
  # Runtime fetching is disabled in main() via GoogleFonts.config so any
  # unbundled lookup throws loudly instead of hitting the network.
  #
  # Source: upstream google/fonts repo ships only variable .ttf files for
  # Fraunces, Geist, and JetBrains Mono. We copy each variable font to the
  # per-weight filenames google_fonts expects; Flutter's font engine then
  # selects the right weight axis instance at runtime from a TextStyle's
  # fontWeight. Slight asset bloat (~3 copies per family), but no rename of
  # google_fonts-tracked files.
  assets:
    - assets/fonts/
    - assets/icon/
    - assets/splash/

  # Numeral-font options for the schedule displays (Settings → Appearance).
  # Declared explicitly (not via google_fonts) so the exact family names are
  # stable and no runtime lookup is involved. Oswald is a variable font; its
  # weight axis is driven by the TextStyle's fontWeight.
  fonts:
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Variable.ttf
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
